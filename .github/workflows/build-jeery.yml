name: Build jerry Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-jeery.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout jeery build files
        uses: actions/checkout@v4

      - name: Test jeery source adaptation
        run: python3 -m unittest discover -s tests -v

      - name: Prepare complete upstream Part 7 as jeery
        run: python3 scripts/prepare_jeery.py build/jeery

      - name: Apply jerry real Android UI and Tanim Boss identity
        run: python3 scripts/customize_jerry.py build/jeery

      - name: Verify source, original license, creator profile and app ID
        run: python3 scripts/verify_jeery.py build/jeery

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34 from GitHub runner
        run: |
          echo "Android SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0' || sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Compile jeery debug APK
        working-directory: build/jeery
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check actual APK package and installed name
        run: |
          set -euo pipefail
          APK="build/jeery/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > build/jeery-package.txt
          grep -E "^(package:|application-label:|launchable-activity:)" build/jeery-package.txt
          grep -q "package: name='ai.jeery.assistant'" build/jeery-package.txt
          grep -q "application-label:'jerry'" build/jeery-package.txt
          mkdir -p dist
          cp "$APK" dist/jerry.apk
          sha256sum dist/jerry.apk > dist/sha256.txt
          cp build/jeery-package.txt dist/build-package-info.txt
          printf '%s\n' 'jerry TEST APK. Not tested on a physical Android phone.' > dist/README-FIRST.txt
          printf '%s\n' 'Grant microphone, screen-sharing and Accessibility permissions only as needed.' >> dist/README-FIRST.txt
          printf '%s\n' 'This debug APK uses a new local signing certificate per GitHub runner.' >> dist/README-FIRST.txt

      - name: Downloadable jeery Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jerry-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Archive complete jeery source
        run: |
          cd build/jeery
          zip -q -r ../../dist/jeery-source.zip . -x 'app/build/*' 'build/*' '.gradle/*' '.kotlin/*'

      - name: Downloadable complete Android source
        uses: actions/upload-artifact@v4
        with:
          name: jeery-source
          path: dist/jeery-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK link to Releases (manual runs only)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: jeery-test-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" dist/jerry.apk dist/sha256.txt \
            --title "jerry Android test APK #${{ github.run_number }}" \
            --notes "Standalone jerry Android test APK built from original Tech GPTx Part 7 source. This is an unofficial app. Build and branding checks passed, but phone features still require manual testing. Source attribution and license retained." \
            --prerelease

      - name: Build completed
        if: success()
        run: |
          echo "## jerry.apk compiled" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **jerry.apk** from the **jerry-android-apk** artifact or GitHub **Releases**." >> "$GITHUB_STEP_SUMMARY"
          echo "Device tests are still needed for voice, wake-word, YouTube, WhatsApp, Accessibility and screen vision." >> "$GITHUB_STEP_SUMMARY"
