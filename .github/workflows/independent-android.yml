name: Independent jerry Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/independent-jerry-source
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/independent-android.yml'
concurrency:
  group: independent-jerry-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK from GitHub runner
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0' || sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile original independent Java app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify separate preview package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/jerry-badging.txt
          grep -q "package: name='ai.jeery.assistant.clean'" /tmp/jerry-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jerry-independent-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Prepare direct downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/jerry-independent.apk
          sha256sum dist/jerry-independent.apk > dist/sha256.txt

      - name: Publish independent test APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: jerry-independent-test-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" dist/jerry-independent.apk dist/sha256.txt \
            --title "jerry Independent Android Preview #${{ github.run_number }}" \
            --target "$GITHUB_SHA" \
            --notes "Independent-source jerry preview by Tanim Boss, separate Android package. Compilation passed, but full feature parity and target phone functionality are not verified. The earlier jerry app remains unchanged. Test only; do not uninstall your working app." \
            --prerelease

      - name: Direct APK link
        if: success()
        run: |
          echo "## Direct jerry-independent.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/jerry-independent-test-${{ github.run_number }}/jerry-independent.apk" >> "$GITHUB_STEP_SUMMARY"
